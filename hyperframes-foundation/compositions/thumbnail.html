<!--
  Thumbnail sub-composition TEMPLATE.

  Copy to compositions/thumbnail.html (the orchestrator copies this verbatim
  at scaffold; the agent customizes the per-video copy during Phase 4).

  Rendered to a single PNG via:
      npx hyperframes snapshot -c compositions/thumbnail.html \
          --at 0.0 --frames 1

  CLI variables (passed via --variables):
    - title     (string, YouTube title — single, fully-styled)
    - subtitle  (string, optional sub-title / channel name)
    - palette   (object, color overrides — same tokens as scene comps)

  Design notes:
    - Pure Remotion primitives equivalent: text + gradient bg, no AI images.
    - Per the existing pipeline (SKILL.md Phase 4), the thumbnail should be
      composed entirely of Remotion primitives — translated to HTML here as
      CSS gradients, typography, simple shapes. Avoid <img> of AI-generated
      content for the official YouTube thumb.
-->
<template id="thumbnail-template">
  <div
    data-composition-id="thumbnail"
    data-composition-variables='[
      {"id":"title","type":"string","label":"Title","default":"Your Title Here"},
      {"id":"subtitle","type":"string","label":"Subtitle","default":""}
    ]'
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="1.0"
  >
    <!-- Gradient background (YouTube thumbnail safe area: 1280x720 inner) -->
    <div
      id="thumb-background"
      class="clip"
      data-start="0"
      data-duration="1.0"
      data-track-index="0"
      style="position: absolute; inset: 0;
             background: linear-gradient(135deg,
               var(--color-primary, #ff0050) 0%,
               var(--color-secondary, #00ffa3) 100%);"
    ></div>

    <!-- Decorative diagonal stripe (CTR focal-point anchor) -->
    <div
      id="thumb-stripe"
      class="clip"
      data-start="0"
      data-duration="1.0"
      data-track-index="1"
      style="position: absolute; left: -200px; top: 60%; width: 2400px; height: 240px;
             transform: rotate(-8deg);
             background: rgba(0, 0, 0, 0.35);"
    ></div>

    <!-- Main title -->
    <h1
      id="thumb-title"
      class="clip"
      data-start="0"
      data-duration="1.0"
      data-track-index="2"
      style="position: absolute; left: 8%; right: 8%; top: 32%;
             font-family: var(--font-headline, 'Inter'), sans-serif;
             font-size: 168px; font-weight: 900; line-height: 0.95;
             color: var(--color-text, #ffffff);
             text-shadow: 0 8px 28px rgba(0,0,0,0.4);
             text-align: left; letter-spacing: -3px;"
    ></h1>

    <!-- Optional subtitle / channel name -->
    <h2
      id="thumb-subtitle"
      class="clip"
      data-start="0"
      data-duration="1.0"
      data-track-index="3"
      style="position: absolute; left: 8%; top: 60%; right: 30%;
             font-family: var(--font-body, 'Inter'), sans-serif;
             font-size: 56px; font-weight: 500; line-height: 1.2;
             color: var(--color-text, #ffffff);
             text-shadow: 0 4px 14px rgba(0,0,0,0.3);
             letter-spacing: 1px; text-transform: uppercase;"
    ></h2>

    <style>
      [data-composition-id="thumbnail"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        // Read variables (render-time overrides via --variables).
        const vars = (window.__hyperframes && window.__hyperframes.getVariables)
          ? window.__hyperframes.getVariables()
          : { title: "Your Title Here", subtitle: "" };

        const titleEl = document.querySelector(
          '[data-composition-id="thumbnail"] #thumb-title',
        );
        const subtitleEl = document.querySelector(
          '[data-composition-id="thumbnail"] #thumb-subtitle',
        );
        if (titleEl) titleEl.textContent = vars.title || "";
        if (subtitleEl) {
          if (vars.subtitle) {
            subtitleEl.textContent = vars.subtitle;
          } else {
            subtitleEl.style.display = "none";
          }
        }

        // A statically-posed thumbnail: no animation — the composition is
        // captured as a single PNG via `hyperframes snapshot`. We still
        // register a no-op timeline so the framework can seek it.
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["thumbnail"] = tl;
      })();
    </script>
  </div>
</template>
