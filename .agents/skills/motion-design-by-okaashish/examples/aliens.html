<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Aliens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#d9d6cf}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       font:12px/1.4 ui-monospace,Consolas,monospace;color:#555}
  canvas{display:block;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.18);background:#f7f5ef}
  .bar{display:flex;gap:14px;align-items:center}
  button{font:inherit;padding:4px 10px;border:1px solid #999;background:#fff;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><button id="snd">sound: off</button><span>click / space: pause · ← →: scrub · R: restart</span></div>
<script>
// Every value is a pure function of time t (seconds), so any frame can be drawn on its own.
const W = 720, H = 1280, DUR = 22, BASE = 770, BR = 22, INK = '#151515';
const FONT = '"Patrick Hand","Comic Sans MS",cursive';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let K = 1, BF = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const h = Math.min(innerHeight - 52, (innerWidth - 32) * 16 / 9), w = h * 9 / 16;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  K = cv.width / W;
}
addEventListener('resize', resize); resize();

// ---------- math ----------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const spring = (x, k = 7, w = 13) => x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(w * x);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const loopW = cycles => TAU * cycles / DUR;   // angular speed that repeats exactly every loop

// Blend through keyed values: [[t, v1, v2...], ...]
function keyed(list, t, bl = .22) {
  let v = list[0].slice(1);
  for (let i = 1; i < list.length; i++) {
    const e = list[i]; if (t < e[0]) break;
    const k = smooth(e[0], e[0] + bl, t); v = v.map((x, j) => lerp(x, e[j + 1], k));
  }
  return v;
}

// ---------- paper ----------
const paperTex = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#f7f5ef'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(120,110,90,${hash(i * .7) * .05})`; g.fillRect(hash(i * 1.3) * W, hash(i * 2.9) * H, 1.2, 1.2); }
  const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(90,80,60,.10)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1a1a1a';
  for (let y = 22; y < H; y += 44) { g.beginPath(); g.roundRect(-4, y, 12, 22, 3); g.fill(); }
  return c;
})();

// ---------- cast ----------
const CH = {
  A: { x: 190, r: 74, kind: 'ant',   voice: 170, ph: 0 },
  B: { x: 362, r: 64, kind: 'crown', voice: 400, ph: 1.3 },
  C: { x: 540, r: 68, kind: 'elf',   voice: 280, ph: 2.6 },
};
const NECK = 96;
const HOPS = {
  A: [[9.18, 34, .36], [12.75, 14, .26], [13.55, 14, .26]],
  B: [[4.1, 34, .32], [4.55, 30, .3], [8.38, 44, .36], [12.3, 16, .24], [13.0, 16, .24], [19.5, 26, .32]],
  C: [[5.62, 10, .18], [12.5, 14, .24], [13.3, 14, .24]],
};
const LEAN = {
  A: [[0, 0], [1.9, .13], [3.9, 0], [12.6, -.06], [14.3, 0]],
  B: [[0, 0], [2.0, -.06], [4.0, 0], [12.3, .05], [14.0, 0]],
  C: [[0, 0], [2.0, -.05], [4.0, 0], [17.2, -.07], [18.6, 0]],
};
const TILT = {
  A: [[0, 0], [1.9, .12], [4, 0], [11, -.15], [12, 0]],
  B: [[0, 0], [1.9, -.15], [4, .05], [5.3, 0], [17.3, .12], [18.6, 0]],
  C: [[0, -.06], [1.9, -.15], [4, 0], [20.3, -.06]],
};
// arm angles [left, right]: 0 = hanging down, positive = swung outward / up, negative = wrapped round the ball
const ARMS = {
  A: [[0, .5, .5], [1.9, .6, 1.5], [2.6, 1.2, .7], [3.3, 1, 1.1], [4, .5, .5], [9.05, 2.5, 2.5], [9.6, .5, .5],
      [11, 1.7, 1.7], [11.5, .5, .5], [15.75, 1.5, 1.5], [15.98, -.45, -.45], [16.08, -.45, 2.6], [16.22, .3, 1], [16.6, .5, .5],
      [19.5, 1, 1], [20.2, .5, .5]],
  B: [[0, .5, .5], [4, 2.7, 2.7], [5.3, .5, .5], [8.1, 1.4, 1.4], [8.4, .6, .6], [8.7, 2.7, 2.7], [9.9, .5, .5],
      [12.2, .25, .25], [13, 2.6, .3], [13.5, .5, .5], [14.85, 1.5, 1.5], [15.1, -.45, -.45], [15.25, 2.6, -.45], [15.4, 1, .3],
      [15.7, .5, .5], [19.4, 2.7, 2.7], [20.2, .5, .5]],
  C: [[0, .5, 2.3], [1.8, .5, .5], [5.55, 1.3, 1.3], [6.1, .5, .5], [6.5, 1.2, 1.2], [6.78, -.45, -.45], [7.5, 2.7, -.45],
      [7.75, 1, .3], [8.1, .5, .5], [11.45, 1.6, 1.6], [11.72, -.45, -.45], [14.3, 2.6, -.45], [14.52, 1, .3], [14.9, .5, .5],
      [16.7, 1.5, 1.5], [16.95, -.45, -.45], [19.1, 2.4, 2.4], [19.45, 2.9, 2.9], [19.9, .5, .5], [20.3, .5, 2.3]],
};
const WAVE = { C: [[0, 1.8], [20.3, DUR]] };
const LOOK = {
  A: [[0, 'cam'], [1.9, 'B'], [2.9, 'C'], [3.5, 'B'], [5.4, 'ball'], [11.4, 'cam'], [12.6, 'C'], [14.4, 'ball'], [20.6, 'cam']],
  B: [[0, 'cam'], [1.95, 'A'], [4.05, 'cam'], [5.4, 'ball'], [12.2, 'A'], [13.4, 'C'], [14.4, 'ball'], [20.6, 'cam']],
  C: [[0, 'cam'], [1.95, 'A'], [4.05, 'B'], [5.4, 'ball'], [12.2, 'A'], [14.4, 'ball'], [17.2, 'B'], [18, 'A'], [18.7, 'ball'], [20.6, 'cam']],
};
const EXPR = {
  A: [[9.35, 10, 'surprised'], [11, 12.3, 'dizzy'], [13, 14.3, 'happy']],
  B: [[4.05, 5.3, 'happy'], [8.55, 10, 'surprised'], [12.2, 14, 'happy'], [19.5, 20.3, 'happy']],
  C: [[5.45, 6.1, 'surprised'], [9.4, 10, 'surprised'], [12.4, 14.2, 'happy'], [17.2, 18.6, 'happy']],
};
const LAUGH = { A: [13, 14.3], B: [12.2, 14], C: [12.4, 14.2] };
const BLINKS = { A: [.8, 5, 7.3, 15, 18.2, 21], B: [1.4, 3.3, 6.5, 10.8, 16.3, 19], C: [2.6, 4.6, 8.2, 15.6, 17, 21.3] };
const TALK = [
  { who: 'A', t0: 1.9,  t1: 4.0,  text: 'psst… wanna play?' },
  { who: 'B', t0: 4.05, t1: 5.3,  text: 'YES!!' },
  { who: 'C', t0: 6.85, t1: 7.75, text: 'catch!' },
  { who: 'B', t0: 9.6,  t1: 10.7, text: 'my crown!', dx: 40 },
  { who: 'A', t0: 11.5, t1: 12.4, text: 'ow…' },
  { who: 'B', t0: 12.3, t1: 13.9, text: 'hehehe', small: true, dx: -10 },
  { who: 'C', t0: 12.5, t1: 14.1, text: 'hahaha!', small: true, dx: 20 },
  { who: 'A', t0: 13.1, t1: 14.3, text: 'heh', small: true },
  { who: 'C', t0: 17.2, t1: 18.6, text: 'best game ever!' },
  { who: 'C', t0: 20.4, t1: 21.7, text: 'bye!' },
];
const charDur = b => Math.min(.065, (b.t1 - b.t0) * .55 / b.text.length);
const A_WOB = [[1.95, .25], [9.35, 1], [11, .6]];
for (const [ts, , d] of HOPS.A) A_WOB.push([ts + d, .3]);

// ---------- pose ----------
function hopState(list, t) {
  let y = 0, sq = 0;
  for (const [ts, h, d] of list) {
    if (t >= ts && t <= ts + d) { const u = (t - ts) / d; y += 4 * h * u * (1 - u); sq += .09 * Math.sin(Math.PI * u); }
    if (t > ts - .12 && t < ts) sq -= .13 * Math.sin(Math.PI * (t - ts + .12) / .12);
    const te = ts + d; if (t > te && t < te + .9) sq -= .16 * Math.exp(-8 * (t - te)) * Math.cos(15 * (t - te));
  }
  return { y, sq };
}
const inWin = (w, t) => w && t >= w[0] && t <= w[1];
function charBase(id, t) {
  const c = CH[id], h = hopState(HOPS[id], t);
  let sq = h.sq + .012 * Math.sin(loopW(9) * t + c.ph), hy = h.y, tilt = keyed(TILT[id], t, .3)[0] + .04 * Math.sin(loopW(4) * t + c.ph);
  if (inWin(LAUGH[id], t)) { hy += Math.abs(Math.sin(t * 16 + c.ph)) * 4; tilt += .06 * Math.sin(t * 8); }
  return { x: c.x, hy, sq, lean: keyed(LEAN[id], t, .35)[0], tilt, r: c.r };
}
function toWorld(st, lx, ly) {
  const sx = lx * (1 - st.sq * .5), sy = ly * (1 + st.sq), c = Math.cos(st.lean), s = Math.sin(st.lean);
  return { x: st.x + sx * c - sy * s, y: BASE - st.hy + sx * s + sy * c };
}
const headC = (id, t) => { const st = charBase(id, t); return toWorld(st, 0, -NECK - st.r * .88); };
const holdPt = (id, t) => toWorld(charBase(id, t), 0, -54);
const headTopBall = (id, t) => { const st = charBase(id, t); return toWorld(st, 0, -NECK - st.r * 1.88 - BR + 4); };
const antTipBall = t => { const st = charBase('A', t), r = st.r; return toWorld(st, .59 * r + 16, -NECK - .88 * r - 1.77 * r - 10); };
function bubbleAnchor(id, t) { const st = charBase(id, t); return toWorld(st, 0, -NECK - st.r * 1.88 - (id === 'A' ? st.r * .95 : 14)); }

// ---------- ball ----------
const BALL = [
  { t0: 5.4,   t1: 6.0,   type: 'drop', p0: () => ({ x: CH.C.x + 60, y: -60 }), p1: () => ({ x: CH.C.x + 58, y: BASE - BR }) },
  { t0: 6.0,   t1: 6.36,  type: 'arc', h: 44, p0: () => ({ x: CH.C.x + 58, y: BASE - BR }), p1: () => ({ x: CH.C.x + 44, y: BASE - BR }) },
  { t0: 6.36,  t1: 6.6,   type: 'arc', h: 14, p0: () => ({ x: CH.C.x + 44, y: BASE - BR }), p1: () => ({ x: CH.C.x + 34, y: BASE - BR }) },
  { t0: 6.6,   t1: 6.78,  type: 'arc', h: 10, p0: () => ({ x: CH.C.x + 34, y: BASE - BR }), p1: t => holdPt('C', t) },
  { t0: 6.78,  t1: 7.72,  type: 'hold', who: 'C' },
  { t0: 7.72,  t1: 8.55,  type: 'arc', h: 120, p0: t => holdPt('C', t), p1: t => headTopBall('B', t) },
  { t0: 8.55,  t1: 9.35,  type: 'arc', h: 95,  p0: t => headTopBall('B', t), p1: antTipBall },
  { t0: 9.35,  t1: 11.0,  type: 'arc', h: 820, p0: antTipBall, p1: t => headTopBall('A', t) },
  { t0: 11.0,  t1: 11.72, type: 'arc', h: 150, p0: t => headTopBall('A', t), p1: t => holdPt('C', t) },
  { t0: 11.72, t1: 14.5,  type: 'hold', who: 'C' },
  { t0: 14.5,  t1: 15.1,  type: 'arc', h: 110, p0: t => holdPt('C', t), p1: t => holdPt('B', t) },
  { t0: 15.1,  t1: 15.38, type: 'hold', who: 'B' },
  { t0: 15.38, t1: 15.98, type: 'arc', h: 110, p0: t => holdPt('B', t), p1: t => holdPt('A', t) },
  { t0: 15.98, t1: 16.2,  type: 'hold', who: 'A' },
  { t0: 16.2,  t1: 16.95, type: 'arc', h: 150, p0: t => holdPt('A', t), p1: t => holdPt('C', t) },
  { t0: 16.95, t1: 19.45, type: 'hold', who: 'C' },
  { t0: 19.45, t1: 20.5,  type: 'arc', h: 260, p0: t => holdPt('C', t), p1: () => ({ x: 820, y: -120 }) },
];
function ballAt(t) {
  for (const s of BALL) {
    if (t < s.t0 || t > s.t1) continue;
    if (s.type === 'hold') return { ...holdPt(s.who, t), vis: true, held: s.who };
    const u = (t - s.t0) / (s.t1 - s.t0), p0 = s.p0(s.t0), p1 = s.p1(s.t1);
    if (s.type === 'drop') return { x: lerp(p0.x, p1.x, u), y: lerp(p0.y, p1.y, u * u), vis: true };
    return { x: lerp(p0.x, p1.x, u), y: lerp(p0.y, p1.y, u) - 4 * s.h * u * (1 - u), vis: true };
  }
  return t < 5.4 ? { x: CH.C.x + 60, y: -60, vis: false } : { x: 820, y: -120, vis: false };
}

// ---------- look / expression ----------
function lookVec(id, t) {
  const hc = headC(id, t);
  const vec = tg => {
    if (tg === 'cam') return { x: 0, y: .1 };
    const p = tg === 'ball' ? ballAt(t) : headC(tg, t), dx = p.x - hc.x, dy = p.y - hc.y, l = Math.hypot(dx, dy) || 1, m = Math.min(1, l / 60);
    return { x: dx / l * m, y: dy / l * m };
  };
  const L = LOOK[id]; let v = vec(L[0][1]);
  for (let i = 1; i < L.length; i++) {
    if (t < L[i][0]) break;
    const k = smooth(L[i][0], L[i][0] + .25, t), w = vec(L[i][1]); v = { x: lerp(v.x, w.x, k), y: lerp(v.y, w.y, k) };
  }
  return v;
}
const exprAt = (id, t) => { for (const [a, b, e] of EXPR[id]) if (t >= a && t <= b) return e; return 'normal'; };
function blinkAt(id, t) { for (const b of BLINKS[id]) if (t >= b && t <= b + .14) return Math.sin(Math.PI * (t - b) / .14); return 0; }
function talkOpen(id, t) {
  for (const b of TALK) {
    if (b.who !== id) continue;
    const u = t - b.t0 - .12, end = b.text.length * charDur(b);
    if (u >= 0 && u <= end) return .15 + .85 * hash(Math.floor(t * 14) + b.t0);
  }
  return 0;
}

// ---------- ink drawing ----------
function circlePath(cx, cy, r, seed) {
  const p = new Path2D(), a1 = hash(BF * 3.1 + seed) * TAU, a2 = hash(BF * 5.7 + seed) * TAU;
  for (let i = 0; i <= 56; i++) {
    const a = i / 56 * TAU, rr = r * (1 + .009 * Math.sin(3 * a + a1) + .006 * Math.sin(5 * a + a2));
    i ? p.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : p.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  p.closePath(); return p;
}
function smoothClosed(pts, seed) {
  const p = new Path2D(), n = pts.length;
  const q = pts.map(([x, y], i) => [x + (hash(BF * 13 + i + seed) - .5) * 1.1, y + (hash(BF * 17 + i + seed) - .5) * 1.1]);
  p.moveTo((q[n - 1][0] + q[0][0]) / 2, (q[n - 1][1] + q[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % n]; p.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  p.closePath(); return p;
}
function inkShape(path, lw = 3.2) {
  ctx.fillStyle = '#fff'; ctx.fill(path);
  ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.lineJoin = ctx.lineCap = 'round'; ctx.stroke(path);
}
function hatchCircle(clipPath, cx, cy, r, a0, a1, n, len, seed, dirRot = .6) {
  ctx.save(); ctx.clip(clipPath); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = lerp(a0, a1, (i + hash(seed + i * 1.7) * .8) / n);
    const sx = cx + Math.cos(a) * (r + 2) + (hash(BF + i + seed) - .5), sy = cy + Math.sin(a) * (r + 2);
    const d = a + Math.PI + dirRot, L = len * (.45 + .55 * hash(seed + i * 3.3)) * (.35 + .65 * Math.sin(Math.PI * (i + .5) / n));
    ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(d) * L, sy + Math.sin(d) * L);
  }
  ctx.stroke(); ctx.restore();
}
function groundHatch(x, y, w, seed) {
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 46; i++) {
    const h1 = hash(seed + i * .37), h2 = hash(seed + i * .71), h3 = hash(seed + i * 1.13), c = h1 + h2 - 1;
    const px = x + c * w * .6, py = y + (h3 - .5) * 7 * (1 - Math.abs(c)) + 1, l = 4 + 6 * hash(seed + i * 2.1);
    ctx.moveTo(px - l, py + 1.5); ctx.lineTo(px + l, py - 1.5);
  }
  ctx.stroke();
}
function star(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, an = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
function sparkle(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fillStyle = INK; ctx.fill();
}

// ---------- character parts ----------
const BODY = [[-11, -97], [-19, -86], [-25, -70], [-29, -48], [-31, -30], [-31, -12], [-29, -2], [-20, 1], [-9, -1], [-7, -14], [-3, -22],
              [0, -23], [3, -22], [7, -14], [9, -1], [20, 1], [29, -2], [31, -12], [31, -30], [29, -48], [25, -70], [19, -86], [11, -97], [0, -99]];
function drawArm(side, angle, waving) {
  ctx.save(); ctx.translate(side * 20, -74); ctx.rotate(-side * angle);
  ctx.beginPath(); ctx.moveTo(-5.5, -2); ctx.lineTo(-5, 26); ctx.arc(0, 26, 5.2, Math.PI, 0, true); ctx.lineTo(5.5, -2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  if (waving) { ctx.lineWidth = 2; ctx.beginPath(); for (const a of [-.6, 0, .6]) { ctx.moveTo(Math.sin(a) * 4, 29); ctx.lineTo(Math.sin(a) * 9, 36); } ctx.stroke(); }
  ctx.restore();
}
function drawEyes(r, look, expr, blink, t) {
  for (const side of [-1, 1]) {
    const ex = side * .4 * r + look.x * .07 * r, ey = .08 * r + look.y * .06 * r, rx = .235 * r, ry = .175 * r;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(side * .18);
    if (expr === 'happy') {
      ctx.strokeStyle = INK; ctx.lineWidth = .07 * r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, .08 * r, rx * .8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (expr === 'dizzy') {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.beginPath();
      for (let k = 0; k <= 40; k++) { const a = k * .45 + t * 8 * side, rr = k / 40 * ry * .9; ctx.lineTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr); }
      ctx.stroke();
    } else if (blink > .85) {
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-rx, 0); ctx.quadraticCurveTo(0, .06 * r, rx, 0); ctx.stroke();
    } else {
      const sc = expr === 'surprised' ? 1.18 : 1;

  const u8 = new Uint8Array(v.buffer); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
