<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lily Boat</title>
<style>
  html,body{margin:0;height:100%;background:#d6d0bf}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       font:12px/1.4 ui-monospace,Consolas,monospace;color:#4d5a48}
  canvas{display:block;border-radius:6px;box-shadow:0 12px 40px rgba(20,40,25,.25);background:#ece6d6}
  .bar{display:flex;gap:14px;align-items:center}
  button{font:inherit;padding:4px 10px;border:1px solid #999;background:#fff;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><button id="snd">sound + music: off</button><span>click / space: pause · ← →: scrub · R: restart</span></div>
<script>
// Every value is a pure function of time t (seconds), so any frame can be drawn on its own.
// Beats: 0.25 a green watercolour dot drops on paper · 1.0 it blooms into the pond · 1.5 dark submerged leaves bleed in ·
// 1.9 lotus leaves pop outward · 3.0 koi swim in · 3.2 the boat rows up the channel · 9.8 it stops, the passenger feeds
// the koi and they swarm · 12.0 rowing off · 15.1 fade back to paper (loop).

// ---------- ① canvas ----------
const W = 720, H = 1280, DUR = 16;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let K = 1;
function setPixelWidth(px) { cv.width = Math.round(px); cv.height = Math.round(px * H / W); K = cv.width / W; }
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const h = Math.min(innerHeight - 52, (innerWidth - 32) * H / W), w = h * W / H;
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; setPixelWidth(w * dpr);
}
addEventListener('resize', fit); fit();

// ---------- ② math ----------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const spring = (x, k = 7, w = 13) => x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(w * x);
const frac = x => x - Math.floor(x);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const loopW = cycles => TAU * cycles / DUR;
const rot = (v, a) => ({ x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) });
const norm = v => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- ③ textures (built once) ----------
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blot(g, x, y, r, rgb, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
const PAPER = '#ece6d6', WATER = '#1a432b';
const pondTex = (() => {
  const TS = 1.5, c = makeCanvas(W * TS, H * TS), g = c.getContext('2d'), r = rng(7);
  g.scale(TS, TS); g.fillStyle = WATER; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 360; i++) {
    const dark = r() < .55;
    blot(g, r() * W, r() * H, 25 + r() * 140, dark ? '14,44,25' : '52,104,62', .06 + r() * .12);
  }
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = `rgba(${r() < .5 ? '150,200,150' : '6,26,14'},${r() * .08})`;
    g.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5);
  }
  return c;
})();
const paperTex = (() => {
  const c = makeCanvas(W * 2, H * 2), g = c.getContext('2d'), r = rng(11);
  g.fillStyle = PAPER; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 260; i++) blot(g, r() * c.width, r() * c.height, 40 + r() * 200, r() < .5 ? '206,194,165' : '255,252,240', .05 + r() * .08);
  return c;
})();
const grainPat = (() => {
  const c = makeCanvas(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256), r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return ctx.createPattern(c, 'repeat');
})();

// ---------- ④ the channel: arc-length table so anything can ride along it ----------
const CHP = [[255, 1640], [248, 1300], [258, 1080], [300, 880], [372, 700], [430, 540], [472, 380], [478, 220], [455, 40], [420, -220]];
const CH = (() => {
  const P = [CHP[0], ...CHP, CHP[CHP.length - 1]], raw = [];
  const cr = (a, b, c, d, t) => { const t2 = t * t, t3 = t2 * t; return .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3); };
  for (let i = 1; i < P.length - 2; i++) for (let k = 0; k < 40; k++) {
    const t = k / 40; raw.push([cr(P[i - 1][0], P[i][0], P[i + 1][0], P[i + 2][0], t), cr(P[i - 1][1], P[i][1], P[i + 1][1], P[i + 2][1], t)]);
  }
  raw.push(CHP[CHP.length - 1]);
  const pts = [{ x: raw[0][0], y: raw[0][1] }]; let acc = 0, next = 2;
  for (let i = 1; i < raw.length; i++) {
    const [ax, ay] = raw[i - 1], [bx, by] = raw[i], l = Math.hypot(bx - ax, by - ay);
    while (acc + l >= next) { const k = (next - acc) / l; pts.push({ x: lerp(ax, bx, k), y: lerp(ay, by, k) }); next += 2; }
    acc += l;
  }
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)], tv = norm({ x: b.x - a.x, y: b.y - a.y });
    pts[i].tx = tv.x; pts[i].ty = tv.y;
  }
  return { pts, len: (pts.length - 1) * 2 };
})();
function chAt(s) {
  const x = clamp(s, 0, CH.len - .001) / 2, i = Math.floor(x), k = x - i, a = CH.pts[i], b = CH.pts[i + 1];
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), tx: lerp(a.tx, b.tx, k), ty: lerp(a.ty, b.ty, k) };
}
const sAtY = y => { for (let i = 0; i < CH.pts.length; i++) if (CH.pts[i].y <= y) return i * 2; return CH.len; };
function chDist(x, y) {
  let best = 1e9, bs = 0;
  for (let i = 0; i < CH.pts.length; i += 4) { const p = CH.pts[i], d = Math.hypot(p.x - x, p.y - y); if (d < best) { best = d; bs = i * 2; } }
  return { d: best, s: bs };
}

// ---------- ⑤ boat timeline ----------
const S0 = sAtY(1470), SMID = sAtY(610), SEND = sAtY(150), ROW_P = 1.5;   // strokes every 1.5 beats so splashes sit on the music's grid
const boatS = t => S0 + (SMID - S0) * smooth(3.2, 9.8, t) + (SEND - SMID) * Math.pow(clamp((t - 12) / 4), 2);
const rowM = t => smooth(3.2, 3.6, t) * (1 - smooth(8.6, 9.3, t)) + smooth(11.8, 12.2, t);
function boatPose(t) {
  const P = chAt(boatS(t));
  return { x: P.x, y: P.y, a: Math.atan2(P.ty, P.tx) + .025 * Math.sin(t * 1.3) };
}
const toWorld = (pose, lx, ly) => { const v = rot({ x: lx, y: ly }, pose.a); return { x: pose.x + v.x, y: pose.y + v.y }; };
// Oar angle from the beam (+ toward the bow). Drive with blades in, recovery with blades lifted; trails aft when resting.
function oarState(t) {
  const m = rowM(t), p = frac((t - 3.0) / ROW_P);
  let a, lift;
  if (p < .42) { a = lerp(.62, -.5, smooth(0, 1, p / .42)); lift = 0; }
  else { const k = smooth(0, 1, (p - .42) / .58); a = lerp(-.5, .62, k); lift = Math.sin(Math.PI * k); }
  return { a: lerp(-1.15, a, m), lift: lift * m, m };
}
const oarGeom = (side, a) => {
  const O = { x: -18, y: side * 31 }, d = { x: Math.sin(a), y: side * Math.cos(a) };
  return { O, d, handle: { x: O.x - d.x * 42, y: O.y - d.y * 42 }, tip: { x: O.x + d.x * 150, y: O.y + d.y * 150 }, blade: { x: O.x + d.x * 128, y: O.y + d.y * 128 } };
};
const PAUSE = boatPose(10.5);
const FEED = toWorld(PAUSE, 30, 33 + 72);                        // where the food lands and the koi gather
const PELLETS = (() => {
  const r = rng(21), hand = toWorld(PAUSE, 40, 33 + 26);
  // each pellet lands (t0 + .4) on an eighth note of the score
  return [10.1, 10.35, 10.6, 10.85, 11.1].map((t0, i) => ({ t0, from: hand, to: { x: FEED.x + (r() - .5) * 60, y: FEED.y + (r() - .5) * 50 }, note: [523, 587, 659, 784, 880][i] }));
})();
const CATCHES = [];
for (let k = 0; ; k++) {
  const tc = 3.0 + k * ROW_P; if (tc > DUR - .3) break;
  if (rowM(tc + .05) < .5) continue;
  const pose = boatPose(tc);
  for (const side of [1, -1]) { const g = oarGeom(side, .62); CATCHES.push({ t: tc, side, ...toWorld(pose, g.blade.x, g.blade.y) }); }
}

// ---------- ⑥ lotus leaves (baked once each, with their shadow) ----------
const LTS = 2;
const LEAF_PAL = [
  { c0: '#c2e35e', c1: '#86c53f', c2: '#4a962c', vein: '222,242,156', dk: '28,84,24', edge: '#336a20' },
  { c0: '#acd651', c1: '#70b338', c2: '#3b8428', vein: '210,236,140', dk: '22,72,20', edge: '#2b5f1c' },
  { c0: '#cfe772', c1: '#9acd4b', c2: '#5aa035', vein: '232,246,172', dk: '40,98,30', edge: '#3f7724' },
];
const LIGHT = { x: -.62, y: -.78 };   // one light, top-left: every highlight sits toward it, every shadow falls away from it
function bakeLeaf(r, seed, dark) {
  const R = rng(seed), pad = r * .35, size = 2 * (r + pad), c = makeCanvas(Math.ceil(size * LTS), Math.ceil(size * LTS)), g = c.getContext('2d');
  g.scale(LTS, LTS); g.translate(r + pad, r + pad);
  const ph1 = R() * TAU, ph2 = R() * TAU, lob = 6 + Math.floor(R() * 4);
  const rim = a => r * (1 + .012 * Math.sin(lob * a + ph1) + .008 * Math.sin(13 * a + ph2) + .005 * Math.sin(29 * a + ph1 * 2));
  const path = new Path2D();
  for (let i = 0; i <= 140; i++) { const a = i / 140 * TAU, rr = rim(a); i ? path.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : path.moveTo(rr, 0); }
  path.closePath();
  const P = dark ? { c0: '#1d4527', c1: '#15361e', c2: '#0e2715', vein: '8,24,12', dk: '6,18,9', edge: 'rgba(5,16,8,.6)' } : LEAF_PAL[Math.floor(R() * LEAF_PAL.length)];
  if (!dark) {                                                    // long soft shadow, falling away from the light
    g.save(); g.filter = `blur(${r * .1 * LTS}px)`; g.translate(-LIGHT.x * r * .14, -LIGHT.y * r * .14);
    g.fillStyle = 'rgba(2,14,8,.5)'; g.fill(path); g.restore();
  }
  const cx = r * (R() - .5) * .12, cy = r * (R() - .5) * .12;
  const gr = g.createRadialGradient(cx + LIGHT.x * r * .35, cy + LIGHT.y * r * .35, 0, cx, cy, r * 1.2);
  gr.addColorStop(0, P.c0); gr.addColorStop(.5, P.c1); gr.addColorStop(1, P.c2);
  g.fillStyle = gr; g.fill(path);
  const curl = !dark && R() < .35;
  g.save(); g.clip(path); g.lineCap = 'round';
  const N = 26 + Math.floor(R() * 8), ang = [];
  for (let i = 0; i < N; i++) ang.push(i / N * TAU + (R() - .5) * .08);
  const ray = (a, r0, r1, bend) => {
    const rr = rim(a) * r1, mx = cx + Math.cos(a + bend) * rr * .5, my = cy + Math.sin(a + bend) * rr * .5;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r * r0, cy + Math.sin(a) * r * r0);
    g.quadraticCurveTo(mx, my, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); g.stroke();
  };
  for (let i = 0; i < N; i++) {                                   // fine hatching between the veins: the print look
    const a0 = ang[i], a1 = ang[(i + 1) % N] + (i === N - 1 ? TAU : 0);
    for (let k = 1; k <= 4; k++) {
      const a = lerp(a0, a1, k / 5);
      g.strokeStyle = k % 2 ? `rgba(${P.dk},${dark ? .5 : .26})` : `rgba(${P.vein},${dark ? .12 : .3})`;
      g.lineWidth = r * .009; ray(a, .22 + R() * .3, .98, .03);
    }
  }
  g.strokeStyle = `rgba(${P.vein},${dark ? .5 : .7})`; g.lineWidth = r * .017;
  for (const a of ang) ray(a, .04, 1.02, .04);
  const eg = g.createRadialGradient(cx, cy, r * .6, cx, cy, r * 1.05);
  eg.addColorStop(0, `rgba(${P.dk},0)`); eg.addColorStop(1, `rgba(${P.dk},${dark ? .5 : .3})`);
  g.fillStyle = eg; g.fill(path);
  const sg = g.createLinearGradient(LIGHT.x * r, LIGHT.y * r, -LIGHT.x * r, -LIGHT.y * r);   // form shadow on the far side
  sg.addColorStop(.45, `rgba(${P.dk},0)`); sg.addColorStop(1, `rgba(${P.dk},${dark ? .3 : .26})`);
  g.fillStyle = sg; g.fill(path);
  if (curl) { g.strokeStyle = `rgba(${P.vein},.22)`; g.lineWidth = r * .11; g.stroke(path); }   // a lifted, sunlit rim
  if (!dark) blot(g, cx + LIGHT.x * r * .45, cy + LIGHT.y * r * .45, r * .38, '250,255,215', .1);
  g.fillStyle = dark ? 'rgba(40,80,50,.6)' : `rgba(${P.vein},.95)`; g.beginPath(); g.arc(cx, cy, r * .03, 0, TAU); g.fill();
  g.restore();
  g.strokeStyle = P.edge; g.lineWidth = r * .018; g.stroke(path);
  if (!dark) {                                                    // rim light only on the lit edge
    const rl = g.createLinearGradient(LIGHT.x * r, LIGHT.y * r, 0, 0);
    rl.addColorStop(0, 'rgba(242,255,196,.75)'); rl.addColorStop(1, 'rgba(242,255,196,0)');
    g.strokeStyle = rl; g.lineWidth = r * .022; g.stroke(path);
  }
  return { c, size, off: r + pad };
}
const hwAt = s => 105 + 32 * Math.exp(-(((s - SMID) / 200) ** 2));
const LEAVES = (() => {
  const R = rng(5), out = [];
  for (let i = 0; i < 9000 && out.length < 70; i++) {
    const r = 50 + 82 * R() ** 1.5, x = -90 + R() * 900, y = -90 + R() * 1460, cd = chDist(x, y);   // many small, a few big
    if (cd.d - r * .75 < hwAt(cd.s)) continue;
    if (out.some(o => Math.hypot(o.x - x, o.y - y) < (o.r + r) * .76)) continue;
    out.push({ x, y, r, rot: R() * TAU, ph: R() * TAU, t0: 2.1 + Math.hypot(x - 360, y - 640) / 750 * 1.6 + R() * .12 });
  }
  out.sort((a, b) => a.t0 - b.t0);
  out.forEach((l, i) => l.tex = bakeLeaf(l.r, 100 + i, false));
  return out;
})();
const DARK = (() => {
  const R = rng(8), out = [];
  for (let i = 0; i < 4000 && out.length < 40; i++) {
    const r = 48 + R() * 42, x = -60 + R() * 840, y = -60 + R() * 1400, cd = chDist(x, y);
    if (cd.d - r < 18 || cd.d > 320) continue;
    if (out.some(o => Math.hypot(o.x - x, o.y - y) < (o.r + r) * .75)) continue;
    out.push({ x, y, r, rot: R() * TAU, ph: R() * TAU, t0: 1.8 + Math.hypot(x - 360, y - 640) / 750 * 1.4 + R() * .1 });
  }
  out.forEach((l, i) => l.tex = bakeLeaf(l.r, 500 + i, true));
  return out;
})();
// pink lotus: the one accent colour, a few blooms only, kept away from the boat
[[120, 290], [615, 1000], [585, 170], [130, 1110]].forEach(([tx, ty], i) => {
  let best = null;
  for (const l of LEAVES) if (l.r > 68 && !l.bloom) { const d = Math.hypot(l.x - tx, l.y - ty); if (!best || d < best.d) best = { l, d }; }
  if (best) best.l.bloom = { t0: 4.4 + i * .6, bud: i === 3, sc: .72 + .1 * (i % 2), ox: .18, oy: -.12 };
});
function drawLotus(sc, q, t, bud) {
  if (q <= 0) return;
  ctx.save(); ctx.scale(sc, sc); ctx.rotate(.15 * Math.sin(loopW(1) * t));
  ctx.save(); ctx.filter = 'blur(3px)'; ctx.fillStyle = 'rgba(2,14,8,.35)';
  ctx.beginPath(); ctx.arc(-LIGHT.x * 16, -LIGHT.y * 16, (bud ? 26 : 62) * Math.min(1, q * 1.5), 0, TAU); ctx.fill(); ctx.restore();
  const layers = bud ? [{ n: 3, len: 52, wid: 20, rot: -.4, d: 0, spread: .35 }]
                     : [{ n: 8, len: 70, wid: 28, rot: 0, d: 0 }, { n: 8, len: 56, wid: 23, rot: Math.PI / 8, d: .22 }, { n: 6, len: 38, wid: 17, rot: .25, d: .44 }];
  for (const L of layers) {
    const s = spring(q - L.d, 5, 9); if (s <= 0) continue;
    for (let k = 0; k < L.n; k++) {
      ctx.save(); ctx.rotate(L.rot + (L.spread ? (k - 1) * L.spread : k * TAU / L.n) + (1 - Math.min(s, 1)) * .9);
      const len = L.len * s, wid = L.wid * Math.min(1, s * 1.2);
      const gg = ctx.createLinearGradient(0, 0, 0, -len);
      gg.addColorStop(0, '#fff7f3'); gg.addColorStop(.55, '#f6c4d1'); gg.addColorStop(1, '#e0789b');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(wid, -len * .25, wid * .7, -len * .8, 0, -len);
      ctx.bezierCurveTo(-wid * .7, -len * .8, -wid, -len * .25, 0, 0);
      ctx.fill(); ctx.strokeStyle = 'rgba(255,250,248,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.strokeStyle = 'rgba(200,80,120,.35)'; ctx.lineWidth = .9;
      ctx.beginPath(); ctx.moveTo(0, -len * .15); ctx.lineTo(0, -len * .75); ctx.stroke();
      ctx.restore();
    }
  }
  const cs = bud ? 0 : spring(q - .6, 6, 10);
  if (cs > 0) {
    ctx.fillStyle = '#f2c14a'; ctx.beginPath(); ctx.arc(0, 0, 13 * cs, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d98a2c';
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.arc(Math.cos(a) * 7.5 * cs, Math.sin(a) * 7.5 * cs, 1.7, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
function drawLeaf(l, t, dark) {
  const dt = t - l.t0; if (dt <= 0) return;
  const s = dark ? .86 + .14 * easeOut(dt / .8) : spring(dt, 5, 9); if (s <= .001) return;
  ctx.save();
  ctx.translate(l.x + 1.6 * Math.sin(loopW(2) * t + l.ph), l.y + 1.6 * Math.cos(loopW(2) * t + l.ph * 1.3));
  ctx.rotate(l.rot + .035 * Math.sin(loopW(1) * t + l.ph)); ctx.scale(s, s);
  if (dark) ctx.globalAlpha = smooth(0, .7, dt);
  ctx.drawImage(l.tex.c, -l.tex.off, -l.tex.off, l.tex.size, l.tex.size);
  if (l.bloom) {
    const b = l.bloom; ctx.rotate(-l.rot); ctx.translate(l.r * b.ox, l.r * b.oy);
    drawLotus(b.sc * l.r / 80, (t - b.t0) * .9, t, b.bud);
  }
  ctx.restore();
}
// petals adrift on the current
const PETALS = (() => { const r = rng(61); return [...Array(7)].map((_, i) => ({ t0: 4.2 + i * 1.3, s0: 900 + r() * 700, lat: (r() - .5) * 140, rot: r() * TAU, spin: (r() - .5) * .6, sz: .8 + r() * .5 })); })();
function drawPetals(t) {
  for (const p of PETALS) {
    const dt = t - p.t0; if (dt < 0) continue;
    const P = chAt(p.s0 - dt * 14), lat = p.lat + 10 * Math.sin(dt * .7 + p.rot);
    const x = P.x - P.ty * lat, y = P.y + P.tx * lat, a = smooth(0, .8, dt);
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + dt * p.spin); ctx.scale(p.sz, p.sz); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(2,14,8,.35)'; ctx.beginPath(); ctx.ellipse(3, 5, 11, 5.5, 0, 0, TAU); ctx.fill();
    const gg = ctx.createLinearGradient(-11, 0, 11, 0); gg.addColorStop(0, '#fff4f1'); gg.addColorStop(1, '#e88aa8');

// ---------- ⑩ the pond: a green watercolour dot that blooms to fill the page ----------
function blobGrow(t) {

// ---------- ⑪ camera: [t, scale, centreX, centreY] ----------
const CAM = [[0, 1.6, 360, 640], [.95, 1.6, 360, 640], [2.3, 1, 360, 640], [4.2, 1, 360, 640],

// a red seal pressed into the corner, like the artist's stamp on a print
const SEAL_AT = 14.0;

  ctx.fillStyle = '#c3311f'; ctx.beginPath(); ctx.roundRect(-z / 2, -z / 2, z, z, 4 * K); ctx.fill();

// ---------- ⑫ frame ----------

const PENTA = [196, 220, 262, 294, 330, 392];                     // G3–G4: an octave under the melody so pops sit beneath it

// ---------- music: the score is data too. 60 BPM, so one beat = 1 s and the 16 s loop is exactly 4 bars ----------
// C major pentatonic, the same notes the pellets play. C add9 → Am7 → Fmaj7 → G6sus2, and G resolves to C across the loop seam.
const MIX = { music: .6 };

const CHORDS = [

for (const [t, m] of MELODY) SCORE.push({ t, f: (ac, w) => INST.pluck(ac, w, m, .07, .12) });
SCORE.push({ t: 10, f: (ac, w) => INST.bell(ac, w, 84) }, { t: 1, f: (ac, w) => INST.bell(ac, w, 88, .03) });

// ---------- ⑭ playback + render contract ----------
let AC = null, soundOn = false, start = performance.now(), paused = false, held = 0, prevT = 0;
const now = () => paused ? held : ((performance.now() - start) / 1000) % DUR;

function toggle() { if (paused) { paused = false; setTime(held); } else { held = now(); paused = true; } }
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }

  else if (e.key === 'ArrowLeft') setTime(now() - .5);

  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();

});
function fireSounds(a, b) {
  if (!soundOn || paused || !AC) return;
  const hit = t => b >= a ? (t > a && t <= b) : (t > a || t <= b);

  for (const e of SCORE) if (hit(e.t)) e.f(AC, AC.currentTime);

function wavBase64(buf) {

  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, bytes - 8, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, ch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true);
  v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < ch; c++, o += 2) v.setInt16(o, clamp(data[c][i], -1, 1) * 32767, true);
  const u8 = new Uint8Array(v.buffer); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));

window.__comp = {
  dur: DUR, w: W, h: H,
  capture(t, pxW) { paused = true; held = t; setPixelWidth(pxW); frame(t); return cv.toDataURL('image/png'); },
  // Renders DUR + 4 s, then folds the tail (reverb, pad release) back onto the start, so the loop has no seam.
  // opts.music = false leaves the score out (render.py --bgm swaps in your own track).
  async audio(sr = 48000, opts = {}) {
    const TAIL = 4, n = Math.ceil(DUR * sr), ac = new OfflineAudioContext(2, n + TAIL * sr, sr);
    for (const e of EVENTS) e.f(ac, e.t);

      const d = buf.getChannelData(c), o = out.getChannelData(c);
      o.set(d.subarray(0, n)); for (let i = n; i < d.length; i++) o[i - n] += d[i];
    }
    return wavBase64(out);
  },
};
window.seek = t => { paused = true; held = t; prevT = t; frame(t); };
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null) { paused = true; held = +qt; }
(function loop() { const t = now(); fireSounds(prevT, t); prevT = t; frame(t); requestAnimationFrame(loop); })();
</script>
